[package]
name = "tree-sitter-wolfram"
description = "Tree-sitter grammar for Wolfram Language"
version = "0.0.1"
authors = ["Brenton Bostick", "Giulio Alessandrini <giulio.a@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "wolfram"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/WolframResearch/tree-sitter-wolfram"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
